name: Verificar segredos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Detectar conflitos de Git que ficaram nos arquivos
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> )' -- '*.js' '*.cjs' '*.ts' '*.tsx' '*.md'; then
            exit 1
          fi
      - name: Baixar Gitleaks oficial e verificar integridade
        shell: bash
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          expected=$(awk '$2=="gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' checksums.txt)
          test -n "$expected"
          echo "$expected  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Verificar histórico com valores ocultos
        run: ./gitleaks git --redact=100 --no-banner .
